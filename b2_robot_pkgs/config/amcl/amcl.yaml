# =============================================================================
# AMCL (Adaptive Monte Carlo Localization) 参数模板
# =============================================================================
# 使用激光雷达进行定位
use_map_topic: true

# 粒子滤波参数
min_particles: 500
max_particles: 5000
kld_err: 0.05
kld_z: 0.99

# 更新参数
update_min_d: 0.2
update_min_a: 0.5
resample_interval: 2

# 激光模型参数
laser_min_range: 0.1
laser_max_range: 30.0
laser_max_beams: 60
laser_z_hit: 0.95
laser_z_short: 0.1
laser_z_max: 0.05
laser_z_rand: 0.05
laser_sigma_hit: 0.2
laser_lambda_short: 0.1
laser_model_type: likelihood_field

# 里程计模型参数
odom_model_type: diff-corrected
odom_alpha1: 0.2
odom_alpha2: 0.2
odom_alpha3: 0.2
odom_alpha4: 0.2

# 坐标系参数
global_frame_id: map
odom_frame_id: odom
base_frame_id: base_link

# 初始位姿（若有先验知识可设置）
initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0
initial_cov_xx: 0.25
initial_cov_yy: 0.25
initial_cov_aa: 0.0685

# 变换发布
transform_tolerance: 0.5
